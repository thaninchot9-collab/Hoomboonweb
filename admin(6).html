const sb=C.SUPABASE_URL?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;let me,ROLE="",CAT=[],tab="dash";

$("#lf").onsubmit=async e=>{e.preventDefault();if(!sb)return;const f=Object.fromEntries(new FormData(e.target));const {error}=await sb.auth.signInWithPassword({email:f.e,password:f.p});if(error)return $("#le").textContent=error.message;boot()};

 const {data}=await sb.from("profiles").select("role").eq("id",u.id).single();if(!["admin","staff"].includes(data?.role)){await sb.auth.signOut();$("#le").textContent="บัญชีนี้ไม่มีสิทธิ์ Admin";return}

const V={
async dash(){const [o,p,m,pay]=await Promise.all([sb.from("orders").select("*").order("created_at",{ascending:false}),sb.from("products").select("name,sku,stock"),sb.from("profiles").select("id",{count:"exact",head:true}),sb.from("payments").select("id").eq("status","รอตรวจสอบ")]);
 const O=o.data||[],ok=O.filter(x=>["ชำระเงินแล้ว","กำลังเตรียมสินค้า","จัดส่งแล้ว","สำเร็จ"].includes(x.status)),low=(p.data||[]).filter(x=>x.stock<=5),d30=Date.now()-30*864e5;
 $("#v").innerHTML=`<div class="stats">${[["ยอดขาย (ชำระแล้ว)",fmt(ok.reduce((a,b)=>a+ +b.total,0))],["ยอดขาย 30 วัน",fmt(ok.filter(x=>+new Date(x.created_at)>d30).reduce((a,b)=>a+ +b.total,0))],["คำสั่งซื้อ",O.length],["สมาชิก",m.count],["สินค้า",p.data.length],["สต็อกรวม",p.data.reduce((a,b)=>a+b.stock,0)],["รอตรวจสลิป",pay.data.length]].map(([a,b])=>`<div class="box">${a}<b>${b}</b></div>`).join("")}</div>
 <div class="box"><h3>สินค้าใกล้หมด</h3>${low.map(x=>`<div>${esc(x.sku)} ${esc(x.name)} — เหลือ ${x.stock}</div>`).join("")||"ไม่มี"}</div><div class="box"><h3>คำสั่งซื้อล่าสุด</h3>${O.slice(0,5).map(x=>`<div class="row"><span>${esc(x.order_no)}</span><span>${esc(x.status)}</span><b>${fmt(x.total)}</b></div>`).join("")||"ยังไม่มี"}</div>`},
async prods(){const {data}=await sb.from("products").select("*,product_images(url,path,is_cover)").order("created_at",{ascending:false});
 $("#v").innerHTML=`<input id="ps" placeholder="ค้นหา"><div id="pl"></div>`;const draw=()=>{const q=$("#ps").value.toLowerCase();$("#pl").innerHTML=data.filter(p=>!q||(p.name+p.sku).toLowerCase().includes(q)).map(p=>`<div class="box row"><span><b>${esc(p.name)}</b><br><small>${esc(p.sku)} • ${fmt(p.price)} • คงเหลือ ${p.stock} • ${p.status=="active"?"แสดง":"ซ่อน"}</small></span><span><button class="btn g" data-e="${p.id}">แก้ไข</button> <button class="btn r" data-d="${p.id}">ลบ</button></span></div>`).join("")||"ยังไม่มีสินค้า"};draw();$("#ps").oninput=draw;

 $("#v").onclick=async e=>{const s=e.target.dataset.s,x=e.target.dataset.x;if(s){const r=await sb.from("categories").update({name:document.querySelector(`[data-i="${s}"]`).value}).eq("id",s);toast(r.error?r.error.message:"บันทึกแล้ว")}if(x&&await ask("ลบหมวดหมู่นี้? สินค้าในหมวดจะไม่มีหมวด")){const r=await sb.from("categories").delete().eq("id",x);toast(r.error?r.error.message:"ลบแล้ว");go()}}},
async orders(){const {data}=await sb.from("orders").select("*,order_items(*),payments(*)").order("created_at",{ascending:false});const ST=["รอชำระเงิน","รอตรวจสอบการชำระเงิน","ชำระเงินแล้ว","กำลังเตรียมสินค้า","จัดส่งแล้ว","สำเร็จ","ยกเลิก"];
 $("#v").innerHTML=`<input id="os" placeholder="ค้นหาเลขคำสั่งซื้อ / ชื่อ / เบอร์"><div class="row"><button class="btn g" id="lball">☑ เลือกทั้งหมด</button><button class="btn" id="lbgo">🏷 ฉลากที่เลือก (พิมพ์/แชร์)</button><button class="btn g" id="rcgo">🧾 ใบเสร็จที่เลือก</button></div><div id="ol"></div>`;const draw=()=>{const q=$("#os").value.toLowerCase();$("#ol").innerHTML=data.filter(o=>(o.order_no+" "+(o.customer?.name||"")+" "+(o.customer?.phone||"")).toLowerCase().includes(q)).map(o=>{const c=o.customer;return`<div class="box"><div class="row"><b>${esc(o.order_no)}</b><select data-st="${o.id}">${ST.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></div>
 ${o.claimed_by?`<div class="row" style="background:#e8f5e9;border-radius:8px;padding:6px 8px;margin:6px 0"><span>${o.claimed_by_avatar?`<img src="${esc(o.claimed_by_avatar)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle">`:"👤"} <b>${esc(o.claimed_by_name)}</b> รับออเดอร์แล้ว <small>${new Date(o.claimed_at).toLocaleString("th-TH")}</small></span><button class="btn g" data-rel="${o.id}">ปล่อยคืน</button></div>`:`<div style="background:#fff3cd;border-radius:8px;padding:6px 8px;margin:6px 0">⏳ ยังไม่มีพนักงานรับออเดอร์นี้</div>`}<small>${esc(c.name)} ${esc(c.phone)} LINE:${esc(c.line||"-")}<br>${esc(c.addr)} ${esc(c.sub)} ${esc(c.dist)} ${esc(c.prov)} ${esc(c.zip)}<br>หมายเหตุ: ${esc(c.note||"-")}</small>
 <div>${o.order_items.map(i=>`${esc(i.name)} ×${i.qty} (${fmt(i.price)})`).join("<br>")}</div><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><label><input type="checkbox" class="lbk" value="${o.id}" style="width:auto"> เลือกพิมพ์ฉลาก</label><button class="btn g" data-lg="${o.id}">📜 ประวัติ</button><button class="btn g" data-rc="${o.id}">🧾 ใบเสร็จ</button><button class="btn g" data-lb="${o.id}">🏷 ฉลาก</button><button class="btn g" data-cu="${o.id}">👤 ลูกค้า</button></div><div>รวม ${fmt(o.total)} (ส่ง ${fmt(o.shipping)}) • มัดจำ ${fmt(o.deposit)} • คงเหลือ ${fmt(o.balance)} • ${o.method=="cod"?"COD":"โอน"}</div>
 <div class="row"><input data-tr="${o.id}" value="${esc(o.tracking||"")}" placeholder="เลขพัสดุ" style="flex:1"><input data-nt="${o.id}" value="${esc(o.note||"")}" placeholder="หมายเหตุ Admin" style="flex:1"><button class="btn g" data-sv="${o.id}">บันทึก</button></div>
 ${o.payments.map(p=>`<div class="row"><button class="btn g" data-slip="${esc(p.slip_url)}">ดูสลิป</button><span>${esc(p.status)} ${esc(p.admin_note||"")}</span>${p.status=="รอตรวจสอบ"?`<span><button class="btn" data-ok="${p.id}|${o.id}">ยืนยันยอด</button> <button class="btn r" data-no="${p.id}">ปฏิเสธ</button></span>`:""}</div>`).join("")}</div>`}).join("")||"ยังไม่มีคำสั่งซื้อ"};draw();$("#os").oninput=draw;$("#lball").onclick=()=>document.querySelectorAll(".lbk").forEach(x=>x.checked=true);$("#rcgo").onclick=()=>receiptView([...document.querySelectorAll(".lbk:checked")].map(x=>x.value));$("#lbgo").onclick=()=>labelView([...document.querySelectorAll(".lbk:checked")].map(x=>x.value));
 $("#ol").onchange=async e=>{const id=e.target.dataset.st;if(!id)return;const r=await sb.from("orders").update({status:e.target.value}).eq("id",id);toast(r.error?r.error.message:"เปลี่ยนสถานะแล้ว")};
 $("#ol").onclick=async e=>{const d=e.target.dataset;if(d.rc)return receiptView([d.rc]);if(d.lb)return labelView([d.lb]);if(d.cu)return custView(d.cu);if(d.sv){const r=await sb.from("orders").update({tracking:document.querySelector(`[data-tr="${d.sv}"]`).value,note:document.querySelector(`[data-nt="${d.sv}"]`).value}).eq("id",d.sv);toast(r.error?r.error.message:"บันทึกแล้ว")}
  if(d.rel&&await ask("ปล่อยออเดอร์คืน?","ใช่ ปล่อยคืน")){const r=await sb.rpc("release_order",{p_order:d.rel});toast(r.error?r.error.message:"ปล่อยออเดอร์แล้ว");go()}
  if(d.lg){const {data:L}=await sb.from("order_logs").select("*").eq("order_id",d.lg).order("created_at");alert((L||[]).map(l=>`${new Date(l.created_at).toLocaleString("th-TH")} • ${l.actor_name}: ${l.action}`).join("\n")||"ยังไม่มีประวัติ")}
  if(d.slip){const {data:u}=await sb.storage.from("slips").createSignedUrl(d.slip,300);if(u)window.open(u.signedUrl,"_blank")}
  if(d.ok){const [pid,oid]=d.ok.split("|"),n=prompt("หมายเหตุ (ถ้ามี)")||"";await sb.from("payments").update({status:"ยืนยันแล้ว",admin_note:n,reviewed_by:me.id,reviewed_at:new Date()}).eq("id",pid);await sb.from("orders").update({status:"ชำระเงินแล้ว"}).eq("id",oid);toast("ยืนยันแล้ว");go()}
  if(d.no){const n=prompt("เหตุผลที่ปฏิเสธ")||"";await sb.from("payments").update({status:"ปฏิเสธ",admin_note:n,reviewed_by:me.id,reviewed_at:new Date()}).eq("id",d.no);toast("ปฏิเสธสลิปแล้ว");go()}}},
async users(){const {data}=await sb.from("profiles").select("*").order("created_at",{ascending:false});const RN={customer:"ลูกค้า",staff:"พนักงาน",admin:"Admin"};
 $("#v").innerHTML=`<div class="box"><b>วิธีเพิ่มพนักงาน:</b> ให้พนักงานสมัครสมาชิกที่หน้าร้านก่อน แล้วเลือกสิทธิ์ "พนักงาน" ที่รายชื่อด้านล่าง พนักงานจะเห็นเฉพาะเมนูคำสั่งซื้อ & สลิป และแก้ยอดเงินไม่ได้</div><input id="us" placeholder="ค้นหาอีเมล/ชื่อ/เบอร์/รหัสบัญชี"><div id="ul"></div>`;
 const draw=()=>{const q=$("#us").value.toLowerCase();$("#ul").innerHTML=(data||[]).filter(u=>!q||((u.email||"")+(u.full_name||"")+(u.phone||"")+acct(u.id)).toLowerCase().includes(q)).map(u=>`<div class="box row"><span>${u.avatar_url?`<img src="${esc(u.avatar_url)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle"> `:""}${esc(u.full_name||"-")} ${esc(u.phone||"")}<br><small>รหัส <b>${acct(u.id)}</b> • ${esc(u.email||"(ไม่มีอีเมล)")}</small></span><span><button class="btn g" data-cv="${u.id}">ข้อมูล</button> <select data-r="${u.id}" ${u.id==me.id?"disabled":""}>${Object.entries(RN).map(([k,v])=>`<option value="${k}" ${k==u.role?"selected":""}>${v}</option>`).join("")}</select></span></div>`).join("")||"ไม่พบสมาชิก"};draw();$("#us").oninput=draw;
 $("#ul").onclick=e=>{const v=e.target.dataset.cv;if(v)custView(null,v)};$("#ul").onchange=async e=>{const id=e.target.dataset.r;if(!id)return;const v=e.target.value;if(v=="admin"&&!await ask("ให้สิทธิ์ Admin เต็มรูปแบบกับคนนี้?","ใช่ ให้สิทธิ์")){return go()}const r=await sb.from("profiles").update({role:v}).eq("id",id);toast(r.error?r.error.message:"เปลี่ยนสิทธิ์แล้ว")}},
async set(){const {data:s}=await sb.from("store_settings").select("*").eq("id",1).single();const f=[["name","ชื่อร้าน"],["phone","เบอร์โทร"],["line","LINE"],["facebook","Facebook"],["address","ที่อยู่ร้าน"],["hours","เวลาทำการ"],["about","ข้อความแนะนำร้าน"],["bank_info","ข้อมูลบัญชีธนาคาร"],["map1_name","ชื่อสาขา 1"],["map1_url","ลิงก์ Google Maps สาขา 1"],["map2_name","ชื่อสาขา 2"],["map2_url","ลิงก์ Google Maps สาขา 2"],["shipping_fee","ค่าจัดส่ง (บาท)"],["deposit_percent","มัดจำ % (เช่น 10/20/30/50 หรือกำหนดเอง)"],["deposit_fixed","มัดจำคงที่ (บาท)"],["deposit_min","มัดจำขั้นต่ำ (บาท)"],["cod_note","เงื่อนไข COD"]];
 $("#v").innerHTML=`<form class="box" id="sf">${f.map(([k,l])=>`<label>${l}<input name="${k}" value="${esc(s[k]??"")}"></label>`).join("")}

 <p>รูปที่อัปโหลด: <label>โลโก้ <input type="file" accept="image/*" data-u="logo_url"></label> <label>รูปหน้าร้าน (ส่วนเกี่ยวกับร้าน) <input type="file" accept="image/*" data-u="about_image_url"></label> <label>Banner <input type="file" accept="image/*" data-u="banner_url"></label> <label>QR พร้อมเพย์ <input type="file" accept="image/*" data-u="qr_url"></label></p><button class="btn">บันทึกการตั้งค่า</button></form>`;
 $("#sf").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};f.forEach(([k])=>{let v=fd.get(k);o[k]=["shipping_fee","deposit_percent","deposit_fixed","deposit_min"].includes(k)?(v===""?(k=="deposit_fixed"?null:0):+v):v});o.deposit_mode=fd.get("deposit_mode");o.deposit_enabled=fd.has("deposit_enabled");o.cod_enabled=fd.has("cod_enabled");
  const r=await sb.from("store_settings").update(o).eq("id",1);toast(r.error?r.error.message:"บันทึกแล้ว")};

async function sniff(f){const b=new Uint8Array(await f.slice(0,12).arrayBuffer());const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
