async function sniff(f){const b=new Uint8Array(await f.slice(0,12).arrayBuffer());const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");

async function akLoad(){akSkus=[];for(let i=0;;i+=1000){const {data,error}=await sb.from("products").select("sku").range(i,i+999);if(error){toast(error.message);break}akSkus.push(...data.map(x=>x.sku));if(data.length<1000)break}}
function akNext(p){let mx=null;const re=new RegExp("^"+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\d+)$");for(const s of akSkus){const m=re.exec(s);if(m){const n=+m[1];if(n>=akCfg.start&&n<=akCfg.end&&(mx===null||n>mx))mx=n}}const n=mx===null?akCfg.start:mx+1;return n>akCfg.end?null:n}
function akFill(){const f=$("#pf");if(!f||!f.elements.sku)return;const cid=f.elements.category_id.value||null,p=akPre(cid),n=akNext(p);f.elements.sku.value=n===null?"":akMk(p,n);akQ("#skn").textContent=n===null?"เลขเต็มช่วงที่ตั้งไว้แล้ว — ไปแท็บ “รหัสอัตโนมัติ” เพื่อขยายช่วง":"รหัสอัตโนมัติ: "+akMk(p,n)+" (แก้ไขเองได้)"}
async function akShrink(f){if(f.size<8e5||!window.createImageBitmap)return f;try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/webp",.85));if(!b||b.type!="image/webp"||b.size>=f.size)return f;return new File([b],f.name.replace(/\.\w+$/,"")+".webp",{type:"image/webp"})}catch(e){return f}}
function akRead(){akCfg.prefix=$("#cp").value.trim();akCfg.digits=Math.max(1,+$("#cd").value||4);akCfg.start=+$("#cs").value||0;akCfg.end=+$("#ce").value||0;document.querySelectorAll(".akp").forEach(i=>{akCfg.pre[i.dataset.id]=i.value.trim()});akSave()}
function akRef(){const n=akNext(akPre(CAT[0]?.id));akQ("#ex").textContent=akMk(akCfg.prefix,akCfg.start)+" … "+akMk(akCfg.prefix,akCfg.end);akQ("#nx").textContent=n===null?"เต็มช่วงแล้ว":akMk(akPre(CAT[0]?.id),n)+" (หมวดแรก)"}
async function akView(){await akLoad();
 $("#v").innerHTML=`<div class="box"><h3>1) ตั้งค่ารหัสสินค้าอัตโนมัติ</h3><div class="row"><div style="flex:1"><label>ตัวนำหน้า (ทุกหมวด)</label><input id="cp" value="${esc(akCfg.prefix)}"></div><div style="flex:1"><label>จำนวนหลักเลข</label><input id="cd" type="number" min="1" value="${akCfg.digits}"></div></div><div class="row"><div style="flex:1"><label>เริ่มที่เลข</label><input id="cs" type="number" value="${akCfg.start}"></div><div style="flex:1"><label>ถึงเลข</label><input id="ce" type="number" value="${akCfg.end}"></div></div>
 <label>ตัวนำหน้าแยกตามหมวด (ว่าง = ใช้ตัวหลัก) / ติ๊กหมวดที่จะเพิ่มสินค้า</label>${CAT.map(c=>`<div class="row"><label style="flex:1"><input type="checkbox" class="akc" value="${c.id}" checked style="width:auto"> ${esc(c.name)}</label><input class="akp" data-id="${c.id}" style="width:100px" placeholder="${esc(akCfg.prefix)}" value="${esc(akCfg.pre[c.id]||"")}"></div>`).join("")||"<p>ยังไม่มีหมวดหมู่</p>"}
 <p>ตัวอย่าง: <b id="ex"></b><br>รหัสถัดไป: <b id="nx" style="color:var(--o)"></b></p><small>การเพิ่มสินค้าทีละชิ้นที่แท็บ “เพิ่มสินค้า” จะเติมรหัสถัดไปให้อัตโนมัติตามค่านี้</small></div>
 <div class="box"><h3>2) เพิ่มสินค้าอัตโนมัติหลายชิ้น</h3><div class="row"><div style="flex:1"><label>จากเลข</label><input id="bf" type="number"></div><div style="flex:1"><label>ถึงเลข</label><input id="bt" type="number"></div></div>
 <label>แบบชื่อสินค้า ({sku} รหัส, {no} เลข, {cat} หมวด)</label><input id="bn" value="สินค้า {sku}"><div class="row"><div style="flex:1"><label>ราคาเริ่มต้น</label><input id="bp" type="number" min="0" value="0"></div><div style="flex:1"><label>สต็อก</label><input id="bk" type="number" min="0" value="0"></div></div>
 <label>สถานะ</label><select id="bs"><option value="hidden">ซ่อนไว้ก่อน (แนะนำ)</option><option value="active">แสดงในร้านทันที</option></select>
 <label>ความเร็ว: <b id="spl">${akCfg.speed}</b> ชิ้น/วินาที (ปรับได้ขณะกำลังเพิ่ม)</label><input id="sv2" type="range" min="1" max="20" value="${akCfg.speed}" style="padding:0">
 <small>ติ๊กหลายหมวด = วนใส่ทีละหมวด • เลขที่รหัสซ้ำจะถูกข้าม • สินค้าที่สร้างต้องไปแก้ชื่อ/ราคา/รูปที่ “จัดการสินค้า”</small>
 <div style="height:10px;background:#f3dfae;border-radius:9px;overflow:hidden;margin:8px 0"><i id="pg" style="display:block;height:100%;width:0;background:var(--o)"></i></div><div id="pt">พร้อม</div>
 <p><button class="btn" id="go">เริ่มเพิ่ม</button> <button class="btn g" id="pa" disabled>หยุดชั่วคราว</button> <button class="btn g" id="st" disabled>ยกเลิก</button></p><div id="log" style="max-height:180px;overflow:auto;font-size:13px;background:#faf3e0;border-radius:8px;padding:8px;white-space:pre-wrap"></div></div>`;
 document.querySelectorAll("#cp,#cd,#cs,#ce,.akp").forEach(i=>i.oninput=()=>{akRead();akRef()});
 $("#sv2").oninput=()=>{akCfg.speed=+$("#sv2").value;$("#spl").textContent=akCfg.speed;akSave()};$("#go").onclick=akBulk;
 $("#pa").onclick=()=>{if(akRun){akRun.pause=!akRun.pause;$("#pa").textContent=akRun.pause?"ทำต่อ":"หยุดชั่วคราว"}};$("#st").onclick=()=>{if(akRun)akRun.stop=true};
 akRef();const n=akNext(akPre(CAT[0]?.id));$("#bf").value=n??akCfg.start;$("#bt").value=Math.min(akCfg.end,(n??akCfg.start)+9)}
async function akBulk(){akRead();const from=+$("#bf").value,to=+$("#bt").value;
 if(!(from<=to))return toast("ช่วงเลขไม่ถูกต้อง");if(from<akCfg.start||to>akCfg.end)return toast("เลขต้องอยู่ในช่วง "+akCfg.start+" – "+akCfg.end);
 if(akRun)return;const ids=[...document.querySelectorAll(".akc:checked")].map(x=>x.value),cl=ids.length?ids:[null],total=to-from+1;
 if(total>100&&!confirm("จะเพิ่มสินค้า "+total+" ชิ้น ยืนยันหรือไม่?"))return;
 const tpl=$("#bn").value||"สินค้า {sku}",price=+$("#bp").value||0,stock=parseInt($("#bk").value)||0,status=$("#bs").value;
 akRun={stop:false,pause:false};$("#go").disabled=true;$("#pa").disabled=false;$("#st").disabled=false;$("#log").textContent="";
 let ok=0,skip=0,fail=0,streak=0,k=0;const L=t=>{const l=akQ("#log");l.textContent+=t+"\n";l.scrollTop=l.scrollHeight};
 for(let n=from;n<=to&&!akRun.stop;n++,k++){
  while(akRun.pause&&!akRun.stop)await akSleep(200);if(akRun.stop)break;
  const cid=cl[k%cl.length],p=akPre(cid),sku=akMk(p,n),cn=CAT.find(c=>c.id===cid)?.name||"";
  if(akSkus.includes(sku)){skip++;L("ข้าม "+sku+" (มีอยู่แล้ว)")}
  else{const r=await sb.from("products").insert({sku,name:tpl.replace(/\{sku\}/g,sku).replace(/\{no\}/g,n).replace(/\{cat\}/g,cn),price,stock,category_id:cid,status,description:""});
   if(r.error){fail++;streak++;L("ผิดพลาด "+sku+": "+r.error.message);if(streak>=3){L("หยุดอัตโนมัติ: ผิดพลาดติดกัน 3 ครั้ง");break}}else{ok++;streak=0;akSkus.push(sku);L("เพิ่ม "+sku)}}
  akQ("#pg").style.width=Math.round((k+1)/total*100)+"%";akQ("#pt").textContent=`เพิ่ม ${ok} • ข้าม ${skip} • ผิดพลาด ${fail} จาก ${total}`;
  await akSleep(1000/Math.max(1,akCfg.speed))}
 const stopped=akRun.stop;akRun=null;akQ("#pt").textContent=(stopped?"ยกเลิกแล้ว • ":"เสร็จสิ้น • ")+`เพิ่ม ${ok} • ข้าม ${skip} • ผิดพลาด ${fail}`;
 const g=$("#go");if(g){g.disabled=false;$("#pa").disabled=true;$("#st").disabled=true;$("#pa").textContent="หยุดชั่วคราว";akRef()}toast("เสร็จสิ้น เพิ่ม "+ok+" ชิ้น")}
function form(p){tab=p?"prods":"newp";document.querySelectorAll("#nv button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));let imgs=(p?.product_images||[]).map(i=>({...i,old:true})),news=[];
 $("#v").innerHTML=`<form class="box" id="pf"><h3>${p?"แก้ไขสินค้า":"เพิ่มสินค้า"}</h3><input name="sku" placeholder="รหัสสินค้า" required value="${esc(p?.sku)}">${p?"":'<div class="row"><small id="skn"></small><button type="button" class="btn g" id="skb">🔢 รหัสถัดไป</button></div>'}<input name="name" placeholder="ชื่อสินค้า" required value="${esc(p?.name)}"><textarea name="description" placeholder="รายละเอียด">${esc(p?.description)}</textarea>
 <input name="price" type="number" min="0" step="0.01" placeholder="ราคาขาย" required value="${p?.price??""}"><select name="category_id"><option value="">— ไม่มีหมวด —</option>${CAT.map(c=>`<option value="${c.id}" ${c.id==p?.category_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
 <input name="stock" type="number" min="0" step="1" placeholder="จำนวนคงเหลือ" required value="${p?.stock??0}"><select name="status"><option value="active">แสดงในร้าน</option><option value="hidden" ${p?.status=="hidden"?"selected":""}>ซ่อน</option></select>
 <input name="deposit_percent" type="number" min="0" max="100" placeholder="มัดจำเฉพาะสินค้า % (เว้นว่าง = ใช้ค่าทั้งร้าน)" value="${p?.deposit_percent??""}">
 <label><input type="checkbox" name="featured" style="width:auto" ${p?.featured?"checked":""}> สินค้าแนะนำ</label> <label><input type="checkbox" name="bestseller" style="width:auto" ${p?.bestseller?"checked":""}> สินค้าขายดี</label>
 <p>รูปภาพ (แตะรูปเพื่อเลือกเป็นหน้าปก • กด ✕ เพื่อลบ)<input type="file" id="fi" accept="image/*" multiple></p><div class="th" id="th"></div><button class="btn" id="sv">บันทึกสินค้า</button> <button type="button" class="btn g" onclick="tab='prods';go()">ยกเลิก</button></form>`;
 if(!p){akLoad().then(akFill);$("#pf").elements.category_id.onchange=akFill;$("#skb").onclick=akFill}
 const th=()=>{if(!imgs.some(i=>i.is_cover)&&imgs[0])imgs[0].is_cover=true;$("#th").innerHTML=imgs.map((i,k)=>`<div><img class="${i.is_cover?"cv":""}" src="${esc(i.url||i.prev)}" data-c="${k}"><button type="button" data-r="${k}">✕</button></div>`).join("")};th();
 $("#th").onclick=e=>{const d=e.target.dataset;if(d.c!==undefined){imgs.forEach(i=>i.is_cover=false);imgs[d.c].is_cover=true}if(d.r!==undefined){imgs.splice(d.r,1)}th()};
 $("#fi").onchange=async e=>{for(const f0 of e.target.files){let f=f0;try{f=await akShrink(f);if(!await sniff(f))throw new Error(f.name+" ไม่ใช่ไฟล์รูปที่รองรับ");imgs.push({file:f,prev:URL.createObjectURL(f)})}catch(x){toast(x.message)}}e.target.value="";th()};
 $("#pf").onsubmit=async e=>{e.preventDefault();const b=$("#sv");b.disabled=true;b.textContent="กำลังอัปโหลด/บันทึก...";try{const fd=new FormData(e.target);const row={sku:fd.get("sku"),name:fd.get("name"),description:fd.get("description"),price:+fd.get("price"),category_id:fd.get("category_id")||null,stock:parseInt(fd.get("stock")),status:fd.get("status"),featured:fd.has("featured"),bestseller:fd.has("bestseller"),deposit_percent:fd.get("deposit_percent")===""?null:+fd.get("deposit_percent")};
  let id=p?.id;if(p){const r=await sb.from("products").update(row).eq("id",id);if(r.error)throw r.error}else{const r=await sb.from("products").insert(row).select("id").single();if(r.error)throw r.error;id=r.data.id}
  const keep=imgs.filter(i=>i.old).map(i=>i.url),gone=(p?.product_images||[]).filter(i=>!keep.includes(i.url));
  if(gone.length){const gp=gone.map(g=>g.path).filter(Boolean);if(gp.length)await sb.storage.from("product-images").remove(gp);await sb.from("product_images").delete().eq("product_id",id).in("url",gone.map(g=>g.url));}
  for(const [k,i] of imgs.entries()){if(i.file){const u=await upload(i.file,"products/"+id);await sb.from("product_images").insert({product_id:id,url:u.url,path:u.path,is_cover:!!i.is_cover,sort:k})}else await sb.from("product_images").update({is_cover:!!i.is_cover,sort:k}).eq("product_id",id).eq("url",i.url)}
  toast("บันทึกแล้ว หน้าร้านอัปเดตทันที");tab="prods";go()}catch(x){toast(x.message||"ผิดพลาด");b.disabled=false;b.textContent="บันทึกสินค้า"}}}
boot();
</script></body></html>
